name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-frontend:
    name: Build Frontend Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Export Static Bundle
        run: |
          cd frontend
          npm ci
          NEXT_EXPORT=true npm run build

      - name: Upload Frontend Out Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          if-no-files-found: error

  package-portable:
    name: Package Lightweight Portable Archives
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Frontend Out Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - name: Build Portable Zip & Tar.gz
        run: python package_release.py

      - name: Upload Portable Archives
        uses: actions/upload-artifact@v4
        with:
          name: release-portable
          path: |
            dist/AgentHub-Local-*-portable.zip
            dist/AgentHub-Local-*-portable.tar.gz
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows Standalone EXE (x64)
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Download Frontend Out Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - name: Install Runtime & PyInstaller Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
        shell: powershell

      - name: Build Windows Onefile Executable
        run: python build_release_exe.py --mode onefile
        shell: powershell

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/AgentHub-Local-*-windows-*.exe
          if-no-files-found: error

  build-macos-dmg:
    name: Build macOS Standalone DMG (Apple Silicon)
    runs-on: macos-latest
    needs: build-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Download Frontend Out Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      - name: Install Runtime & PyInstaller Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App & DMG Image
        run: python build_release_exe.py --mode macos-dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/AgentHub-Local-*-macos-*.dmg
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release & Upload All Assets
    runs-on: ubuntu-latest
    needs: [package-portable, build-windows-exe, build-macos-dmg]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging
          merge-multiple: true

      - name: Verify All 4 Distribution Packages
        run: ls -lh release_staging

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "AgentHub Local ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_staging/*
