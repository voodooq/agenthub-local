services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agenthub-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8686:8686"
    volumes:
      # 后端源码与静态前端挂载（由 FastAPI 直接托管 ./frontend/out，单容器即可运行完整前后端）
      - ./backend:/app
      - ./frontend/out:/app/static:ro
      - ./version.json:/app/version.json:ro
      - ./data:/app/data
      # 挂载宿主机 CLI 账号隔离目录与默认 ~/.gemini 登录态（兼容 Linux HOME 与 Windows USERPROFILE）
      - ${HOME:-${USERPROFILE:-~}}/.agenthub/accounts:/root/.agenthub/accounts
      - ${HOME:-${USERPROFILE:-~}}/.gemini:/root/.gemini
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/app/data/agenthub_local.db
      - PROFILE_PATH=/app/data/profile.md
      - AUTO_FAILOVER_RETRY=3
      - LOG_LEVEL=INFO
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
